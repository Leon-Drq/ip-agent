name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r backend/requirements.txt pyinstaller==6.18.0
      - run: npm test
      - run: python scripts/audit_source.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: node scripts/test_media.cjs
      - run: python scripts/smoke_backend.py
        env:
          IP_AGENT_MEDIA_BIN: ${{ github.workspace }}/.desktop-test/bin
      - run: python scripts/icon.py
      - run: python scripts/build_backend.py
      - run: python scripts/smoke_backend.py --frozen
        env:
          IP_AGENT_MEDIA_BIN: ${{ github.workspace }}/.desktop-test/bin
      - run: npm run dist -- --${{ matrix.target }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/smoke_desktop.cjs --packaged
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --draft --title "IP智能体 $RELEASE_TAG" --notes "Windows x64 / macOS Apple Silicon arm64 / macOS Intel x64. Community preview; unsigned, not notarized. See README for setup and model requirements." *
